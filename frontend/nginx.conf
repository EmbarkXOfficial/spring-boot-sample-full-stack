server {
    listen 80;

    # Serve the React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Send API calls to the backend container
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Send health checks to the backend container
    location /actuator/health {
        proxy_pass http://backend:8080;
    }
}
